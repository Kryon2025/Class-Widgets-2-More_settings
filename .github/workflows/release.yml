name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Class Widgets 2 SDK
        run: |
          pip install class-widgets-sdk

      - name: Install manifest tooling deps
        run: |
          pip install packaging

      # 顺序很重要：先打插件本体，此时 dist/ 还不存在。
      # 打包器没有排除选项（只有 -o / -f），如果先生成 payload，
      # dist/ 就会被一起卷进 .cwplugin 里。
      - name: Build plugin packages
        run: |
          cw-plugin-pack
          cw-plugin-pack --format zip

      # 校验已提交的 manifest.json 与本次构建产物是否一致。
      # 不一致说明改完源码忘了在本地跑 make_payloads.py 并提交 manifest.json ——
      # 这时若继续发布，用户会下载到 sha256 对不上的包，所以这里直接失败。
      - name: Verify payload manifest is up to date
        run: |
          python tools/make_payloads.py --out-dir dist \
            --tag "${{ github.ref_name }}" --check

      # 构建各功能的 payload 文件（同时刷新工作区里的 manifest.json，仅用于核对）。
      # 新条目默认 tested=false；确认可用后加 --tested 再发一版，
      # 才会被「已适配且已测试」的自动选择逻辑挑中。
      - name: Build feature payloads
        run: |
          python tools/make_payloads.py --out-dir dist \
            --tag "${{ github.ref_name }}" --tested

      - name: Show release artifacts
        run: |
          ls -lh *.cwplugin *.zip 2>/dev/null || true
          ls -lh dist || true

      - name: Publish to plugin registry
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish

      # 从 CHANGELOG.md 摘出与本次标签对应的小节，作为 Release 正文。
      # 找不到时只是告警 + 兜底正文，不会中断发布。
      - name: Prepare release notes
        run: |
          python tools/make_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --changelog CHANGELOG.md \
            --out dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
            dist/*.cwpayload
          body_path: dist/RELEASE_NOTES.md
