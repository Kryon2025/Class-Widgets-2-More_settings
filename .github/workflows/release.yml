name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Class Widgets 2 SDK
        run: |
          pip install class-widgets-sdk

      - name: Install manifest tooling deps
        run: |
          pip install packaging

      # 先打插件本体：此时 dist/ 还不存在，不会被一起卷进 .cwplugin 里
      # （打包器没有排除选项，只有 -o / -f）。
      - name: Build plugin packages
        run: |
          cw-plugin-pack
          cw-plugin-pack --format zip

      # 功能包（payload）不在这个仓库里，也不由本流程发布：
      # 它们住在 Kryon2025/More_Settings-Features（features_src/ + payloads/ + manifest.json），
      # 由 manifest.json 里的仓库直链分发，不进插件广场。这里只发加载器本体。
      - name: Show release artifacts
        run: |
          ls -lh *.cwplugin *.zip 2>/dev/null || true
          ls -lh dist || true

      - name: Publish to plugin registry
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish

      # 从 CHANGELOG.md 摘出与本次标签对应的小节，作为 Release 正文。
      # 找不到时只是告警 + 兜底正文，不会中断发布。
      - name: Prepare release notes
        run: |
          python tools/make_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --changelog CHANGELOG.md \
            --out dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body_path: dist/RELEASE_NOTES.md
